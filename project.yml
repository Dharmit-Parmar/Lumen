name: Lumen
options:
  bundleIdPrefix: com.example
  developmentRegion: en

targets:
  LumenApp:
    type: application
    platform: macOS
    deploymentTarget: "12.3"
    sources: [MacApp]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.Lumen
      INFOPLIST_FILE: MacApp/Info.plist
      CODE_SIGN_ENTITLEMENTS: MacApp/LumenApp.entitlements
    dependencies:
      - target: LumenCameraExtension

  LumenCameraExtension:
    type: system-extension
    platform: macOS
    deploymentTarget: "12.3"
    sources: [CameraExtension]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.Lumen.CameraExtension
      INFOPLIST_FILE: CameraExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: CameraExtension/LumenCameraExtension.entitlements
      GENERATE_INFOPLIST_FILE: NO
